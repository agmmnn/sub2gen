# Agent gateway + Redis + Cloudflare Tunnel (same connector TUNNEL_TOKEN as the rest of your stack).
# Merge with the base file so `sub2gen` exists on the same network:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.agent.yml up -d --build
#
# .env: TUNNEL_TOKEN (see .env.example), optional GATEWAY_*.
#
# Cloudflare Zero Trust → Tunnels → Public hostnames (same tunnel as the admin/API hosts), add e.g.:
#   - https://agents.yourdomain.com  →  http://agent-gateway:9080  (WSS: /ws/agents)
# The API and admin hostnames still point to http://sub2gen:8000
#
# Captcha: admin → remote_browser_base_url = http://agent-gateway:9080, key = GATEWAY_SUB2GEN_BEARER

services:
  agent-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agent-gateway
    container_name: agent-gateway
    ports:
      - "9080:9080"
    environment:
      GATEWAY_SUB2GEN_BEARER: ${GATEWAY_SUB2GEN_BEARER:-change-me-match-sub2gen}
      GATEWAY_AGENT_DEVICE_TOKEN: ${GATEWAY_AGENT_DEVICE_TOKEN:-change-me-device-secret}
      SOLVE_TIMEOUT_SECONDS: ${SOLVE_TIMEOUT_SECONDS:-120}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agent-gateway-redis
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sub2gen-cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - sub2gen
      - agent-gateway
    restart: unless-stopped
