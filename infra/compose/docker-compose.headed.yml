# In-container headed browser (VNC optional) + agent gateway + Cloudflare Tunnel.
#   docker compose -f infra/compose/docker-compose.headed.yml up -d --build
# In Zero Trust, point admin-flow and flow-api hostnames to http://sub2gen-headed:8000
# Optional agent hostname can point to http://agent-gateway:9080 (for /ws/agents).

services:
  sub2gen-headed:
    init: true
    env_file:
      - ../../.env
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.headed
      args:
        VITE_NOVNC_URL: ${VITE_NOVNC_URL:-}
    image: sub2gen:headed
    container_name: sub2gen-headed
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
      - "${VNC_HOST_PORT:-5900}:${VNC_PORT:-5900}"
      - "${NOVNC_HOST_PORT:-6080}:${NOVNC_PORT:-6080}"
    volumes:
      - ../../.runtime/data:/app/.runtime/data
      - ../../.runtime/tmp:/app/.runtime/tmp
      - ../../config/setting.toml:/app/config/setting.toml
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOW_DOCKER_HEADED_CAPTCHA=true
      - DISPLAY=:99
      - XVFB_SCREEN=${XVFB_SCREEN:-1920x1080x24}
      - ENABLE_HEADED_VNC=${ENABLE_HEADED_VNC:-true}
      - ENABLE_HEADED_NOVNC=${ENABLE_HEADED_NOVNC:-true}
      - VNC_PORT=${VNC_PORT:-5900}
      - NOVNC_PORT=${NOVNC_PORT:-6080}
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      - SUB2GEN_API_ONLY_HOST=${SUB2GEN_API_ONLY_HOST:-flow-api.prismacreative.online}
      - SUB2GEN_REDIS_URL=${SUB2GEN_REDIS_URL:-redis://redis:6379/0}
      - SUB2GEN_REDIS_MODE=${SUB2GEN_REDIS_MODE:-shadow}
      - SUB2GEN_DATABASE_BACKEND=${SUB2GEN_DATABASE_BACKEND:-sqlite}
      - SUB2GEN_DATABASE_URL=${SUB2GEN_DATABASE_URL:-}
      - SUB2GEN_DB_SCHEMA=${SUB2GEN_DB_SCHEMA:-sub2gen}
      - SUB2GEN_REQUIRE_CUTOVER_MARKER=${SUB2GEN_REQUIRE_CUTOVER_MARKER:-true}
    shm_size: ${SHM_SIZE:-2gb}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  agent-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agent-gateway
    container_name: agent-gateway
    ports:
      - "9080:9080"
    environment:
      - GATEWAY_SUB2GEN_BEARER=${GATEWAY_SUB2GEN_BEARER:-change-me-match-sub2gen}
      - GATEWAY_AGENT_DEVICE_TOKEN=${GATEWAY_AGENT_DEVICE_TOKEN:-change-me-device-secret}
      - GATEWAY_AGENT_AUTH_MODE=${GATEWAY_AGENT_AUTH_MODE:-keygen}
      - KEYGEN_VERIFY_MODE=${KEYGEN_VERIFY_MODE:-introspection}
      - KEYGEN_API_URL=${KEYGEN_API_URL:-https://api.keygen.sh}
      - KEYGEN_ACCOUNT=${KEYGEN_ACCOUNT:-}
      - KEYGEN_PUBLIC_KEY=${KEYGEN_PUBLIC_KEY}
      - KEYGEN_API_TOKEN=${KEYGEN_API_TOKEN:-}
      - SOLVE_TIMEOUT_SECONDS=${SOLVE_TIMEOUT_SECONDS:-120}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agent-gateway-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 512m
    volumes:
      - sub2gen-headed-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sub2gen-headed-cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - sub2gen-headed
      - agent-gateway
    restart: unless-stopped

volumes:
  sub2gen-headed-redis-data:
