version: '3.8'

services:
  sub2gen:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: sub2gen-local:latest
    container_name: sub2gen-local
    ports:
      - "38000:8000"
    volumes:
      - ../../.runtime/data:/app/.runtime/data
      - ../../.runtime/tmp:/app/.runtime/tmp
      - ../../config/setting.toml:/app/config/setting.toml
    environment:
      - PYTHONUNBUFFERED=1
      - SUB2GEN_API_ONLY_HOST=${SUB2GEN_API_ONLY_HOST:-}
      - SUB2GEN_DATABASE_BACKEND=${SUB2GEN_DATABASE_BACKEND:-postgres}
      - SUB2GEN_DATABASE_URL=${SUB2GEN_DATABASE_URL:-postgresql://sub2gen:sub2gen@postgres:5432/sub2gen}
      - SUB2GEN_DB_SCHEMA=${SUB2GEN_DB_SCHEMA:-sub2gen}
      - SUB2GEN_REQUIRE_CUTOVER_MARKER=${SUB2GEN_REQUIRE_CUTOVER_MARKER:-false}
      - SUB2GEN_REDIS_URL=${SUB2GEN_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sub2gen-local-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sub2gen}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sub2gen}
      - POSTGRES_DB=${POSTGRES_DB:-sub2gen}
    volumes:
      - sub2gen-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2gen} -d ${POSTGRES_DB:-sub2gen}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sub2gen-local-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sub2gen-local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sub2gen-local-postgres-data:
  sub2gen-local-redis-data:
