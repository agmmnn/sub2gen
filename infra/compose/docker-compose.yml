# sub2gen app only. For Cloudflare Tunnel + agent gateway, merge:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.agent.yml up -d
#
# Headed:           docker compose -f infra/compose/docker-compose.headed.yml up -d
# Local + frontend: docker compose -f infra/compose/docker-compose.local.yml up -d
# WARP:             docker compose -f infra/compose/docker-compose.proxy.yml up -d
#
# sub2gen is built from this repo (Vite `apps/admin-web/` → `/app/apps/api/static`).
# To use a published image, remove `build:` and set `image: ghcr.io/agmmnn/sub2gen:latest`.

services:
  sub2gen:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: sub2gen:local
    container_name: sub2gen
    ports:
      - "38000:8000"
    volumes:
      - ../../.runtime/data:/app/.runtime/data
      - ../../.runtime/tmp:/app/.runtime/tmp
      - ../../config/setting.toml:/app/config/setting.toml
    environment:
      - PYTHONUNBUFFERED=1
      - SUB2GEN_API_ONLY_HOST=${SUB2GEN_API_ONLY_HOST:-}
      - SUB2GEN_REDIS_URL=${SUB2GEN_REDIS_URL:-redis://redis:6379/0}
      - SUB2GEN_REDIS_MODE=${SUB2GEN_REDIS_MODE:-shadow}
      - SUB2GEN_DATABASE_BACKEND=${SUB2GEN_DATABASE_BACKEND:-sqlite}
      - SUB2GEN_DATABASE_URL=${SUB2GEN_DATABASE_URL:-}
      - SUB2GEN_DB_SCHEMA=${SUB2GEN_DB_SCHEMA:-sub2gen}
      - SUB2GEN_REQUIRE_CUTOVER_MARKER=${SUB2GEN_REQUIRE_CUTOVER_MARKER:-true}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: sub2gen-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 512m
    volumes:
      - sub2gen-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sub2gen-cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - sub2gen
    restart: unless-stopped

volumes:
  sub2gen-redis-data:
