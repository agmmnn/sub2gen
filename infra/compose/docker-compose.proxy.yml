version: '3.8'

services:
  sub2gen:
    image: ghcr.io/agmmnn/sub2gen:latest
    container_name: sub2gen
    ports:
      - "38000:8000"
    volumes:
      - ../../.runtime/data:/app/.runtime/data
      - ../../.runtime/tmp:/app/.runtime/tmp
      - ../../config/setting_warp.toml:/app/config/setting.toml
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - warp

  warp:
    image: caomingjun/warp
    container_name: warp
    restart: always
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "31080:1080"
    environment:
      - WARP_SLEEP=2
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ../../.runtime/warp:/var/lib/cloudflare-warp

  frontend:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
    image: sub2gen-frontend:local
    container_name: sub2gen-frontend
    ports:
      - "38080:80"
    depends_on:
      - sub2gen
    restart: unless-stopped
