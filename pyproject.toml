[project]
name = "sub2gen"
version = "0.1.0"
description = "Unified local API for browser-backed image and video generation providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "aiosqlite==0.20.0",
  "bcrypt==4.2.1",
  "boto3>=1.35,<2.0",
  "cryptography>=44,<47",
  "curl-cffi==0.7.3",
  "fastapi==0.119.0",
  "httpx>=0.27.0,<1.0.0",
  "nodriver>=0.48.0",
  "pillow==12.2.0",
  "playwright>=1.40.0",
  "prometheus-client==0.22.1",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pydantic==2.10.4",
  "python-dateutil==2.8.2",
  "python-multipart==0.0.20",
  "redis[hiredis]>=5.2,<7.0",
  "tomli==2.2.1",
  "uvicorn[standard]==0.32.1",
  "sub2gen-provider-google-flow",
  "sub2gen-provider-sdk",
  "sub2gen-worker-protocol",
]

[project.scripts]
setup = "sub2gen.local_runner:setup"
sub2gen = "sub2gen.cli:main"
sub2gen-chatgpt-spike = "sub2gen.spikes.chatgpt_web:main"

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
  "sub2gen-provider-chatgpt",
]
agent-gateway = [
  "fastapi==0.119.0",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.10.1",
  "pydantic==2.10.4",
  "uvicorn[standard]==0.32.1",
  "websockets==14.1",
  "sub2gen-worker-protocol",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api/src", "apps/agent-gateway/src"]
include = ["sub2gen*", "sub2gen_gateway*"]

[tool.setuptools.package-data]
sub2gen = ["migrations/**/*.sql", "services/*.csv"]

[tool.uv.workspace]
members = [
  "packages/provider-sdk-python",
  "packages/provider-google-flow",
  "packages/provider-chatgpt",
  "packages/worker-protocol",
]

[tool.uv.sources]
sub2gen-provider-sdk = { workspace = true }
sub2gen-provider-google-flow = { workspace = true }
sub2gen-provider-chatgpt = { workspace = true }
sub2gen-worker-protocol = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "apps/api/tests",
  "packages/provider-sdk-python/tests",
  "packages/provider-google-flow/tests",
  "packages/provider-chatgpt/tests",
  "packages/worker-protocol/tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["apps/admin-web", "apps/metadata-extension", "apps/api/static"]

[tool.ruff.lint]
# Start with correctness-only rules. Broader style rules will be enabled only
# after the existing codebase has been migrated without creating a red gate.
select = ["E9", "F63", "F7", "F82"]
