name: PostgreSQL and Redis Storage Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  storage-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sub2gen
          POSTGRES_PASSWORD: sub2gen
          POSTGRES_DB: sub2gen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sub2gen -d sub2gen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SUB2GEN_TEST_POSTGRES_URL: postgresql://sub2gen:sub2gen@127.0.0.1:5432/sub2gen
      SUB2GEN_REDIS_URL: redis://127.0.0.1:6379/15
      SUB2GEN_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      SUB2GEN_REDIS_MODE: required

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
      - name: Install backend and test dependencies
        run: uv sync --frozen
      - name: Run storage contract tests
        run: >-
          uv run pytest -q
          apps/api/tests/test_postgres_bridge.py
          apps/api/tests/test_postgres_integration.py
          apps/api/tests/test_performance_runtime.py
