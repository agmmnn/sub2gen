[project]
name = "sub2gen-provider-google-gemini"
version = "0.1.0"
description = "Direct Google Gemini image provider for sub2gen"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "sub2gen-provider-sdk"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sub2gen_provider_google_gemini*"]
