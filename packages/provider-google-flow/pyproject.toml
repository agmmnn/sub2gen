[project]
name = "sub2gen-provider-google-flow"
version = "0.1.0"
description = "Google Flow provider adapter for sub2gen"
requires-python = ">=3.11"
dependencies = ["sub2gen-provider-sdk"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sub2gen_provider_google_flow*"]
